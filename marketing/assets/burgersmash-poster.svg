<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090909"/>
      <stop offset="0.55" stop-color="#1a0808"/>
      <stop offset="1" stop-color="#7a0909"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcc31"/>
      <stop offset="1" stop-color="#f58220"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="120" cy="190" r="170" fill="#d71920" opacity="0.18"/>
  <circle cx="980" cy="1080" r="300" fill="#ff8c00" opacity="0.11"/>
  <g opacity="0.35" fill="#ff2a1f">
    <circle cx="930" cy="110" r="8"/><circle cx="970" cy="150" r="4"/><circle cx="870" cy="210" r="5"/>
    <circle cx="80" cy="1040" r="5"/><circle cx="140" cy="1110" r="8"/><circle cx="1010" cy="1230" r="7"/>
  </g>

  <g transform="translate(140 70)">
    <path d="M255 30 C330 0 470 0 545 30 C590 48 610 82 600 115 L200 115 C190 82 210 48 255 30Z" fill="#f5a623"/>
    <circle cx="290" cy="55" r="7" fill="#111"/><circle cx="355" cy="45" r="6" fill="#111"/><circle cx="430" cy="55" r="7" fill="#111"/><circle cx="505" cy="47" r="6" fill="#111"/>
    <path d="M185 130 L620 130" stroke="#d71920" stroke-width="18" stroke-linecap="round"/>
  </g>

  <text x="540" y="250" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="118" font-weight="900" fill="#f5efe6" letter-spacing="-2">BURGER<tspan fill="#e31b23">SMASH</tspan></text>
  <path d="M180 280 L900 255" stroke="#e31b23" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

  <text x="80" y="420" font-family="Impact, Arial Black, sans-serif" font-size="95" fill="#f5efe6">Der Burger,</text>
  <text x="80" y="520" font-family="Impact, Arial Black, sans-serif" font-size="95" fill="#f5efe6">der richtig <tspan fill="#ffae22">kracht.</tspan></text>
  <text x="90" y="590" font-family="Arial Black, Arial, sans-serif" font-size="42" fill="#ffae22">Heiß. <tspan fill="#e31b23">Saftig.</tspan> <tspan fill="#f5efe6">Smash-gebraten.</tspan></text>

  <g filter="url(#shadow)" transform="translate(160 650)">
    <ellipse cx="380" cy="360" rx="360" ry="65" fill="#000" opacity="0.35"/>
    <path d="M90 190 C110 70 650 70 670 190 C640 225 120 225 90 190Z" fill="#b85a20"/>
    <path d="M105 188 C190 130 570 130 655 188" fill="none" stroke="#ffd080" stroke-width="10" opacity="0.45"/>
    <path d="M110 242 C230 205 540 205 655 242 L655 292 C510 325 245 325 110 292Z" fill="#4a1f14"/>
    <path d="M135 292 L630 292 L575 345 L190 345Z" fill="url(#cheese)"/>
    <path d="M115 345 C230 310 540 310 655 345 L655 395 C520 430 245 430 115 395Z" fill="#3a1710"/>
    <path d="M140 395 L630 395 L560 450 L210 450Z" fill="url(#cheese)"/>
    <path d="M120 450 C260 425 520 425 650 450 C615 500 165 500 120 450Z" fill="#54a829"/>
    <path d="M100 510 C135 570 635 570 675 510 C640 640 140 640 100 510Z" fill="#d47a2a"/>
    <g fill="#f3f1df">
      <rect x="270" y="220" width="36" height="28" rx="5" transform="rotate(12 270 220)"/>
      <rect x="360" y="212" width="32" height="25" rx="5" transform="rotate(-8 360 212)"/>
      <rect x="460" y="226" width="34" height="27" rx="5" transform="rotate(10 460 226)"/>
    </g>
    <g fill="#72a43a">
      <ellipse cx="300" cy="205" rx="42" ry="15"/><ellipse cx="420" cy="204" rx="42" ry="15"/><ellipse cx="505" cy="210" rx="42" ry="15"/>
    </g>
  </g>

  <g transform="translate(730 790)">
    <circle cx="150" cy="150" r="145" fill="#f5a623" stroke="#111" stroke-width="10"/>
    <text x="150" y="95" text-anchor="middle" font-family="Arial Black, Arial" font-size="34" fill="#111">Smash Deal:</text>
    <text x="150" y="155" text-anchor="middle" font-family="Impact, Arial Black" font-size="62" fill="#111">Burger</text>
    <text x="150" y="220" text-anchor="middle" font-family="Impact, Arial Black" font-size="56" fill="#111">+ Fries</text>
    <text x="150" y="280" text-anchor="middle" font-family="Impact, Arial Black" font-size="56" fill="#111">+ Drink</text>
  </g>

  <rect x="170" y="1165" width="740" height="105" rx="12" fill="#d71920" transform="rotate(-2 540 1218)"/>
  <text x="540" y="1240" text-anchor="middle" font-family="Impact, Arial Black" font-size="76" fill="#fff">Jetzt probieren!</text>
  <text x="540" y="1310" text-anchor="middle" font-family="Arial Black, Arial" font-size="44" fill="#fff"><tspan fill="#ffae22">Smash</tspan> deinen Hunger.</text>
</svg>
